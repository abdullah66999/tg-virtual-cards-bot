version: '3.9'
services:
  bot:
    image: tg-virtual-cards-bot:latest
    build: .
    env_file: .env
    command: python bot.py
    restart: unless-stopped
  webhook:
    image: tg-virtual-cards-bot:latest
    build: .
    env_file: .env
    command: uvicorn webhook:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
